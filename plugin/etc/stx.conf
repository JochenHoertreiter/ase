#   [plugin] fetch Claude Code module type definitions (once)
lint-types {js}
    const fs   = require("node:fs")
    const file = "mods/claude-code.d.ts"
    const url  = "https://raw.githubusercontent.com/anthropics/claude-code/refs/heads/main/mods/types/claude-code.d.ts"
    if (!fs.existsSync(file)) {
        fetch(url).then((res) => {
            if (!res.ok)
                throw new Error(`failed to fetch ${url}: HTTP ${res.status}`)
            return res.text()
        }).then((text) => {
            fs.writeFileSync(file, text, "utf8")
        }).catch((err) => {
            console.error(err.message)
            process.exit(1)
        })
    }

#   [plugin] lint project
lint : lint-types
    echo "◉ lint: markdown (markdownlint)" && \
    markdownlint-cli2 --config etc/markdownlint.yaml \
        "meta/*.md" "skills/**/*.md" "output-styles/*.md" "!meta/ase-format-specbook.md" && \
    echo "◉ lint: markdown (eslint)" && \
    eslint --config etc/eslint.mjs --ignore-pattern meta/ase-format-specbook.md meta skills output-styles && \
    echo "◉ lint: typescript (tsc)" && \
    tsc --project etc/tsc.json && \
    echo "◉ lint: typescript (claude)" && \
    claude plugin validate --strict .

#   [plugin] build project
build : lint {js}
    const fs   = require("node:fs")
    const path = require("node:path")
    const cp   = require("node:child_process")
    const dir  = "skills"
    const data = fs.readdirSync(dir)
        .filter((name) => name !== "ase-help-intent")
        .sort()
        .map((name) => {
            const help  = fs.readFileSync(path.join(dir, name, "help.md"), "utf8")
            const lines = help.split("\n")
            const stop  = lines.findIndex((line) => line.startsWith("##  SEE ALSO"))
            const body  = (stop === -1 ? lines : lines.slice(0, stop)).join("\n")
            return `<purpose name="${name}">\n${body}\n</purpose>\n`
        })
        .join("")
    fs.writeFileSync(path.join(dir, "ase-help-intent", "data.md"), data, "utf8")
    fs.writeFileSync("meta/ase-format-specbook.md",
        cp.execSync("specbook describe -p meta -z 2 -f raw",
        { encoding: "utf8" }), "utf8")
    fs.writeFileSync("meta/ase-format-specbook.yaml",
        cp.execSync("specbook describe -p schema -z 2 -f raw",
        { encoding: "utf8" }), "utf8")

#   [plugin] remove all generated files
clean
    shx rm -f meta/ase-format-specbook.md meta/ase-format-specbook.yaml

#   [plugin] remove all built files
distclean: clean
    shx rm -f package-lock.json
    shx rm -rf node_modules

